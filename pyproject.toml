[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timdr-ai-core"
version = "0.1.0"
description = "TIMDR epistemic protocol core: preregistration, controls, and evidence gating."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jbackk-lang"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
waveform = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools]
py-modules = ["timdr_ai_core", "learning_sandbox", "protect90_learning_adapter", "protect90_waveform_learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
