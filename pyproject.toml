[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timdr-ai-core"
version = "0.1.0"
description = "TIMDR epistemic protocol core: preregistration, controls, and evidence gating."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "jbackk-lang"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
waveform = ["numpy>=1.24", "pandas>=2.0"]
paderborn = ["rarfile>=4.5"]
paderborn-analysis = ["rarfile>=4.5", "numpy>=1.24", "scipy>=1.10"]
operators = ["numpy>=1.24"]

[tool.setuptools]
py-modules = ["timdr_ai_core", "timdr_operators", "neural_network", "learning_sandbox", "protect90_learning_adapter", "protect90_waveform_learning", "protect90_waveform_nn_learning", "environment_policy", "online_learning", "online_ranker", "research_queue", "paderborn_prereg", "paderborn_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
